# .golangci.yml
# Configuration file for golangci-lint
# Schema: golangci-lint v2 (https://golangci-lint.run/docs/product/configuration-file)
version: "2"

run:
  timeout: 5m

linters:
  # v2 ships a standard set (errcheck, govet, ineffassign, staticcheck, unused);
  # enable the extra linters this project wants on top of it.
  default: standard
  enable:
    - gosec
    - misspell
  settings:
    govet:
      enable:
        - shadow
    errcheck:
      check-type-assertions: true
    staticcheck:
      checks:
        # QF* are style-only quick fixes; they are not correctness signals.
        - all
        - -QF*
    gosec:
      excludes:
        - G104 # Audit errors not checked
  exclusions:
    generated: lax
    rules:
      # Many test cases call pure functions purely for smoke coverage and
      # deliberately discard the result (e.g. GCD(0, 5) to prove it terminates).
      - path: '_test\.go$'
        linters: [staticcheck]
        text: 'SA4017'
      # Tests use deterministic math/rand seeds, bit-pattern casts, and temp files.
      - path: '_test\.go$'
        linters: [gosec]
        text: 'G404|G115|G306'
      # The unrolled kernels index slices inside loops guarded by `i+k < n`,
      # which gosec's G602 range analysis cannot follow.
      - path: '^pkg/(arithmetic|quant)/'
        linters: [gosec]
        text: 'G602'
      # Without the `cuda` build tag every internal/gpu method is a stub that
      # unconditionally returns a non-nil error, so `err != nil` looks constant.
      - path: '^cmd/bench/'
        linters: [staticcheck]
        text: 'SA4023'
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

output:
  formats:
    text:
      path: stdout
      colors: true
