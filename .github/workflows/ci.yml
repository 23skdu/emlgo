name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.27.2']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Test with coverage
        if: matrix.go-version == '1.27.2'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.go-version == '1.27.2'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          fail_ci_if_error: false
      - name: Fuzz (short burst)
        if: matrix.go-version == '1.27.2'
        run: |
          go test -run='^$' -fuzz='^FuzzParseNoPanic$' -fuzztime=10s ./internal/jit/...
          go test -run='^$' -fuzz='^FuzzEval$' -fuzztime=10s ./internal/jit/...
          go test -run='^$' -fuzz='^FuzzCompileMatchesEval$' -fuzztime=10s ./internal/jit/...
          go test -run='^$' -fuzz='^FuzzExpSIMD$' -fuzztime=10s ./internal/eml
          go test -run='^$' -fuzz='^FuzzSinSIMD$' -fuzztime=10s ./internal/eml
          go test -run='^$' -fuzz='^FuzzPow$' -fuzztime=10s ./pkg/arithmetic
      - name: Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -exclude-generated -tags purego ./...
      - name: Govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux/amd64
            goos: linux
            goarch: amd64
          - target: linux/arm64
            goos: linux
            goarch: arm64
          - target: darwin/arm64
            goos: darwin
            goarch: arm64
          - target: darwin/amd64
            goos: darwin
            goarch: amd64
          - target: windows/amd64
            goos: windows
            goarch: amd64
          - target: js/wasm
            goos: js
            goarch: wasm
          - target: wasip1/wasm
            goos: wasip1
            goarch: wasm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'
      - name: Build ${{ matrix.target }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/arm64
            runner: ubuntu-24.04-arm
          - name: darwin/arm64
            runner: macos-14
          - name: windows/amd64
            runner: windows-latest
          - name: js/wasm
            runner: ubuntu-latest
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'
      - name: Run platform tests
        if: matrix.name != 'js/wasm'
        run: go test -count=1 ./...
      - name: Run WebAssembly tests
        if: matrix.name == 'js/wasm'
        env:
          GOOS: js
          GOARCH: wasm
        run: go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" -count=1 ./...

  benchmark-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'
      - name: Benchmark base revision
        working-directory: baseline
        run: go test -run='^$' -bench='^(BenchmarkSIMD|BenchmarkExpSIMD|BenchmarkLogSIMD|BenchmarkAddSIMD)$' -benchmem -benchtime=250ms -count=10 ./internal/eml > "$RUNNER_TEMP/bench-base.txt"
      - name: Benchmark pull request revision
        run: go test -run='^$' -bench='^(BenchmarkSIMD|BenchmarkExpSIMD|BenchmarkLogSIMD|BenchmarkAddSIMD)$' -benchmem -benchtime=250ms -count=10 ./internal/eml > "$RUNNER_TEMP/bench-current.txt"
      - name: Check statistically significant regressions
        run: python3 scripts/check_bench_regression.py "$RUNNER_TEMP/bench-base.txt" "$RUNNER_TEMP/bench-current.txt" --max-regression 0.10
