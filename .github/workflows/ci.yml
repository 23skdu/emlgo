name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Test with coverage
        if: matrix.go-version == '1.25'
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage
        if: matrix.go-version == '1.25'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
          fail_ci_if_error: false
      - name: Fuzz (short burst)
        if: matrix.go-version == '1.25'
        run: |
          go test -run='^$' -fuzz=FuzzParse -fuzztime=10s ./internal/jit/...
          go test -run='^$' -fuzz=FuzzEml -fuzztime=10s ./internal/eml/...
          go test -run='^$' -fuzz=FuzzArithmetic -fuzztime=10s ./pkg/arithmetic/...
      - name: Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -tags purego ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
