name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.4'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/emlcli-linux-amd64 ./cmd/emlcli/
          GOOS=linux GOARCH=arm64 go build -o dist/emlcli-linux-arm64 ./cmd/emlcli/
          GOOS=darwin GOARCH=arm64 go build -o dist/emlcli-darwin-arm64 ./cmd/emlcli/
          GOOS=windows GOARCH=amd64 go build -o dist/emlcli-windows-amd64.exe ./cmd/emlcli/
          GOOS=linux GOARCH=amd64 go build -o dist/bench-linux-amd64 ./cmd/bench/
          GOOS=linux GOARCH=amd64 go build -o dist/validate-linux-amd64 ./cmd/validate/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd dist && sha256sum -- * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3.0.0
        with:
          generate_release_notes: true
          files: |
            dist/emlcli-*
            dist/bench-*
            dist/validate-*
            dist/sbom.spdx.json
            dist/checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.0.0
        with:
          subject-path: 'dist/*'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images to GHCR
        run: |
          IMAGE_REPO="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.ref_name }}"
          make docker-build-cpu TAG="${TAG}" IMAGE_REPO="${IMAGE_REPO}"
          make docker-build-cuda TAG="${TAG}" IMAGE_REPO="${IMAGE_REPO}"
          make docker-push TAG="${TAG}" IMAGE_REPO="${IMAGE_REPO}"
