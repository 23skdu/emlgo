name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/emlcli-linux-amd64 ./cmd/emlcli/
          GOOS=linux GOARCH=arm64 go build -o dist/emlcli-linux-arm64 ./cmd/emlcli/
          GOOS=darwin GOARCH=arm64 go build -o dist/emlcli-darwin-arm64 ./cmd/emlcli/
          GOOS=windows GOARCH=amd64 go build -o dist/emlcli-windows-amd64.exe ./cmd/emlcli/
          GOOS=linux GOARCH=amd64 go build -o dist/bench-linux-amd64 ./cmd/bench/
          GOOS=linux GOARCH=amd64 go build -o dist/validate-linux-amd64 ./cmd/validate/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            dist/emlcli-*
            dist/bench-*
            dist/validate-*
            dist/sbom.spdx.json
            dist/checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images to GHCR
        run: |
          IMAGE_REPO="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          TAG="${{ github.ref_name }}"
          make docker-build-cpu TAG="${TAG}" IMAGE_REPO="${IMAGE_REPO}"
          make docker-build-cuda TAG="${TAG}" IMAGE_REPO="${IMAGE_REPO}"
          make docker-push TAG="${TAG}" IMAGE_REPO="${IMAGE_REPO}"
