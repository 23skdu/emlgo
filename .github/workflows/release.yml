name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          go-version: '1.27'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/emlcli-linux-amd64 ./cmd/emlcli/
          GOOS=linux GOARCH=arm64 go build -o dist/emlcli-linux-arm64 ./cmd/emlcli/
          GOOS=darwin GOARCH=arm64 go build -o dist/emlcli-darwin-arm64 ./cmd/emlcli/
          GOOS=windows GOARCH=amd64 go build -o dist/emlcli-windows-amd64.exe ./cmd/emlcli/
          GOOS=linux GOARCH=amd64 go build -o dist/bench-linux-amd64 ./cmd/bench/
          GOOS=linux GOARCH=amd64 go build -o dist/validate-linux-amd64 ./cmd/validate/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksums
        run: |
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v3
        with:
          generate_release_notes: true
          files: |
            dist/emlcli-*
            dist/bench-*
            dist/validate-*
            dist/sbom.spdx.json
            dist/checksums.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@e22c389904149dbc22b58101806040fa8d37a610 # v3
        with:
          subject-path: 'dist/*'
